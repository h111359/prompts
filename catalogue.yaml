# The menu reads its entries from this file. Register each Markdown prompt once.
#
# To add a prompt, copy a complete entry under prompts and edit all five fields.
#   file        Exact path relative to the repository root, with forward slashes.
#   title       Short name displayed in the menu.
#   description One sentence explaining what the prompt does.
#   menu_number Unique positive integer. Keep 0 reserved for menu.md.
#   tags        Names defined in tags.md, one per line. Use tags: [] if none apply.
#
# Indent with spaces. Use two spaces before "- file", four before the remaining
# fields, and six before each tag bullet. Double-quote titles or descriptions
# containing a colon followed by a space or a #.
#
# When moving or renaming a prompt, update file and keep its menu_number.
# When removing a prompt, delete its entire entry.

prompts:
